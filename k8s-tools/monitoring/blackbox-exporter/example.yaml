add this to the prometheus configmap
          - name: blackbox-exporter-rules
            rules:
            - alert: EndpointDown
              expr: probe_success == 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Endpoint {{ $labels.instance }} is down"
                description: "The endpoint {{ $labels.instance }} is not responding with a 200 status code for the last minute."


            scrape_configs:
            - job_name: 'blackbox'
              metrics_path: /probe
              params:
                module: [http_2xx]  # Use the HTTP probe module
              static_configs:
                - targets:
                  - https://google.com
                  - https://github.com/health
                  - hoppscotch-community.hoppscotch.svc.cluster.local
              relabel_configs:
                - source_labels: [_address_]
                  target_label: __param_target
                - source_labels: [__param_target]
                  target_label: instance
                - target_label: _address_
                  replacement: blackbox-exporter-prometheus-blackbox-exporter:9115  # Blackbox Exporter service address
