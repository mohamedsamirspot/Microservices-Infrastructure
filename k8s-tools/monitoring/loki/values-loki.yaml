deploymentMode: Monolithic

serviceAccount:
  create: false
  name: ${loki_service_account_name}

singleBinary:
  replicas: 1
  serviceAccount:
    create: false
    name: ${loki_service_account_name}
  persistence:
    enabled: false

# Disable all other deployment modes/components.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

# Keep the setup minimal.
gateway:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: ${s3_bucket}
      ruler: ${s3_bucket}
      admin: ${s3_bucket}
    s3:
      s3: s3://${s3_bucket}
      region: ${region}
      s3ForcePathStyle: false

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

  ruler:
    enable_api: true

