# ==================== SIDECAR CONFIGURATION ====================
# All datasources, dashboards, plugins, and alerts are managed via ConfigMaps
sidecar:
  # cd /etc/grafana/provisioning/datasources
  datasources:
    enabled: true
    label: grafana_datasource
    labelValue: "1"
    searchNamespace: monitoring
    reloadURL: "http://localhost:3000/api/admin/provisioning/datasources/reload"
  
  # cd /etc/grafana/provisioning/dashboards --> here you just define the place where the dashboards are located
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /var/lib/grafana/dashboards
    searchNamespace: monitoring
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  
  # cd /etc/grafana/provisioning/alerting
  alerts:
    enabled: true
    label: grafana_alert
    labelValue: "1"
    folder: /etc/grafana/provisioning/alerting
    searchNamespace: monitoring
    reloadURL: "http://localhost:3000/api/admin/provisioning/alerting/reload"

  # cd /var/lib/grafana/plugins --> here you define the plugins to be installed
  plugins:
    enabled: true
    label: grafana_plugin
    labelValue: "1"
    searchNamespace: monitoring
    initPlugins: true  # Install before Grafana starts




