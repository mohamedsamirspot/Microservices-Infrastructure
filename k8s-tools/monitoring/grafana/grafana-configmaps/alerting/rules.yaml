apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: kubernetes-alerts
        folder: kubernetes
        interval: 1m
        rules:
          - uid: high-cpu-alert
            title: High CPU Usage
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdvw8iqhzrm68d
                model:
                  editorMode: code
                  expr: 'avg(rate(container_cpu_usage_seconds_total{namespace!="",pod!=""}[5m])) by (pod, namespace) * 100 > 80'
                  instant: true
                  intervalMs: 1000
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Alerting
            for: 5m
            annotations:
              description: 'CPU usage for {{ $labels.pod }} in {{ $labels.namespace }} is above 80%'
              summary: High CPU detected
            labels:
              severity: warning

          - uid: high-memory-alert
            title: High Memory Usage
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: bdvw8iqhzrm68d
                model:
                  editorMode: code
                  expr: '(container_memory_working_set_bytes{namespace!="",pod!=""} / container_spec_memory_limit_bytes{namespace!="",pod!=""}) * 100 > 85'
                  instant: true
                  intervalMs: 1000
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: []
                      reducer:
                        params: []
                        type: avg
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  refId: C
                  type: threshold
            noDataState: NoData
            execErrState: Alerting
            for: 5m
            annotations:
              description: 'Memory usage for {{ $labels.pod }} in {{ $labels.namespace }} is above 85%'
              summary: High memory detected
            labels:
              severity: warning
