apiVersion: 1
groups:
  - orgId: 1
    name: Kubernetes Alerts
    folder: Kubernetes
    interval: 1m
    rules:
      # High CPU Usage Alert
      - uid: high-cpu-alert
        title: High CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: bdvw8iqhzrm68d
            model:
              editorMode: code
              expr: 'avg(rate(container_cpu_usage_seconds_total{namespace!="",pod!=""}[5m])) by (pod, namespace) * 100 > 80'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          description: 'Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has CPU usage above 80% for more than 5 minutes'
          summary: High CPU usage detected
        labels:
          severity: warning

      # High Memory Usage Alert
      - uid: high-memory-alert
        title: High Memory Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: bdvw8iqhzrm68d
            model:
              editorMode: code
              expr: '(container_memory_working_set_bytes{namespace!="",pod!=""} / container_spec_memory_limit_bytes{namespace!="",pod!=""}) * 100 > 85'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          description: 'Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is using more than 85% of its memory limit'
          summary: High memory usage detected
        labels:
          severity: warning

      # Pod Restart Alert
      - uid: pod-restart-alert
        title: Pod Restarting Frequently
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: bdvw8iqhzrm68d
            model:
              editorMode: code
              expr: 'rate(kube_pod_container_status_restarts_total{namespace!="kube-system"}[15m]) > 0'
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: avg
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          description: 'Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently'
          summary: Pod restart detected
        labels:
          severity: critical

