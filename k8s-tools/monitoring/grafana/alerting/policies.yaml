apiVersion: 1
policies:
  - orgId: 1
    receiver: Email - Mohamed
    group_by: ['alertname', 'cluster', 'namespace']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: Email - Mohamed
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 5m
      - receiver: Email - Mohamed
        matchers:
          - severity = warning
        group_wait: 30s
        repeat_interval: 12h
