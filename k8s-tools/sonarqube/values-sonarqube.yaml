# This will:
#   Run SonarQube Community Build
#   Use the embedded PostgreSQL (suitable for dev/test)
#   Require no license

community:
  enabled: true
  buildNumber: "25.12.0.117093"

replicaCount: 1

jdbcOverwrite:
  enabled: true
  jdbcUrl: "jdbc:postgresql://sonarqube-db.abc123.us-east-1.rds.amazonaws.com:5432/sonarqube"
  jdbcUsername: "sonaruser"
  jdbcPassword: "${sonarpassword}"

persistence:
  enabled: false

monitoringPasscodeSecretName: "monitoringpasscode"
monitoringPasscodeSecretKey: "pass-key"

resources:
  requests:
    cpu: 200m
    memory: 2Gi
  limits:
    cpu: 500m
    memory: 2Gi
