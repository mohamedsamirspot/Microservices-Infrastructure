name: Terraform Pipeline

on:
  workflow_dispatch:        # Equivalent to GitLab "web" trigger (manual trigger from UI)
    inputs:
      env:
        description: 'Environment to deploy (e.g., dev or prod)'
        required: true
        default: dev

jobs:
  terraform:
    name: Terraform Workflow
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      env: ${{ github.event.inputs.env }}

    container:
      image: hashicorp/terraform:latest
      options: --entrypoint "/usr/bin/env"
      env:
        PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          export AWS_ACCESS_KEY=$AWS_ACCESS_KEY_ID
          export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          terraform --version
          if [ -z "$env" ]; then
            echo "❌ ERROR: 'env' variable is not set (expected: dev or prod)"
            exit 1
          fi
          cd "envs/$env"
          echo "Current working dir: $(pwd)"
          terraform init

      # ------------------ VALIDATE ------------------
      - name: Terraform Validate
        run: terraform validate

      # ------------------ PLAN ------------------
      - name: Terraform Plan
        id: plan
        run: terraform plan -out=tfplan

      - name: Upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: envs/${{ github.event.inputs.env }}/tfplan

      # ------------------ APPLY (manual) ------------------
      - name: Terraform Apply
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.env != '' }}
        run: terraform apply -auto-approve tfplan

      # ------------------ DESTROY (manual trigger) ------------------
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    container:
      image: hashicorp/terraform:latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      env: ${{ github.event.inputs.env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Terraform Destroy
        run: |
          cd envs/$env
          terraform init
          terraform destroy -auto-approve
