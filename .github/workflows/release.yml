name: Bump version and tag
on:
  push:
    branches:
      - main


jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed so the action can push tags

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so the action can see full history/tags

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Optional inputs below:
          tag_prefix: "v"
          default_bump: minor
          fetch_all_tags: true
