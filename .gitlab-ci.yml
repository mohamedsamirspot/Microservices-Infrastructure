workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'  # Only run pipelines triggered from the GitLab UI
      when: always
    - when: never                        # Block pipelines from all other sources (push, MR, schedules, etc.)

stages:
  - validate
  - plan
  - apply
  - destroy


image:
  name: hashicorp/terraform:latest
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'



before_script:
  - export AWS_ACCESS_KEY=$AWS_ACCESS_KEY_ID
  - export AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
  - rm -rf .terraform
  - terraform --version
  - |
    if [ -z "$env" ]; then
      echo "❌ ERROR: 'env' variable is not set (expected: dev or prod)"
      exit 1
    fi
    cd "envs/$env"
    echo "Current working dir: $(pwd)"
    terraform init

Terraform_validate:
  stage: validate
  script:
    - terraform validate

Terraform_plan:
  stage: plan
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - $env/tfplan

Terraform_apply:
  stage: apply
  script:
    - terraform apply -auto-approve tfplan
  when: manual
  dependencies:
    - Terraform_plan

destroy:
  stage: destroy
  script:
    - terraform destroy -auto-approve
  when: manual
  dependencies:
    - Terraform_apply
